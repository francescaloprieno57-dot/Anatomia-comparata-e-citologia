            padding: 20px;
        }

            max-width: 800px;

        }
        h1, h2 {
            color: var(--primary-color);
            text-align: center;
        }
        .menu-lezioni {
            display: grid;

            gap: 15px;
            margin-top: 25px;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-risposta {
            display: block;
            width: 100%;
            margin: 10px 0;
            text-align: left;
            background-color: #ecf0f1;
            color: #333;
            border: 1px solid #bdc3c7;
        }
        .btn-risposta:hover {
            background-color: #dfe6e9;
        }
        .corretta {
            background-color: var(--success-color) !important;
            color: white !important;
        }
        .errata {
            background-color: var(--error-color) !important;
            color: white !important;
        }
        .nascondi {
            display: none !important;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .risultati-box {
            text-align: center;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            margin-top: 20px;
        }

</head>

    <div id="menu-container">

        </div>
        <div style="margin-top: 30px; text-align: center;">
            <button onclick="avviaRipassoErrori()" style="background-color: #e67e22;" id="btn-ripasso" class="nascondi">Ripassa Domande Sbagliate</button>
        </div>
    </div>

    <!-- SEZIONE QUIZ -->
    <div id="quiz-container" class="nascondi">
        <h2 id="titolo-lezione-corrente"></h2>
        <div id="progresso" style="font-weight: bold; margin-bottom: 15px;"></div>
        <div id="domanda-testo" style="font-size: 18px; margin-bottom: 20px; font-weight: 500;"></div>
        <div id="opzioni-container"></div>
        
        <div class="nav-buttons">
            <button onclick="tornaAlMenu()" style="background-color: #7f8c8d;">Indietro al Menu</button>

    </div>

        </div>

    let lezioneCorrenteKey = null;

    function inizializzaMenu() {
        const listaLezioniDiv = document.getElementById("lista-lezioni");
        listaLezioniDiv.innerHTML = "";
        
        for (let key in databaseQuiz) {
            let btn = document.createElement("button");
            btn.innerText = databaseQuiz[key].titolo;
            btn.onclick = () => avviaQuiz(key);
            listaLezioniDiv.appendChild(btn);
        }

        if (domandeSbagliateGlobali.length > 0) {
            document.getElementById("btn-ripasso").classList.remove("nascondi");
        } else {
            document.getElementById("btn-ripasso").classList.add("nascondi");
        }
    }

    function avviaQuiz(key) {
        lezioneCorrenteKey = key;
        domandeAttive = [...databaseQuiz[key].domande];
        indiceDomanda = 0;
        punteggio = 0;
        inModalitaRipasso = false;

        document.getElementById("menu-container").classList.add("nascondi");
        document.getElementById("risultati-container").classList.add("nascondi");
        document.getElementById("quiz-container").classList.remove("nascondi");
        document.getElementById("titolo-lezione-corrente").innerText = databaseQuiz[key].titolo;

        mostraDomanda();
    }

    function avviaRipassoErrori() {
        if (domandeSbagliateGlobali.length === 0) return;
        domandeAttive = [...domandeSbagliateGlobali];
        indiceDomanda = 0;
        punteggio = 0;
        inModalitaRipasso = true;

        document.getElementById("menu-container").classList.add("nascondi");
        document.getElementById("risultati-container").classList.add("nascondi");
        document.getElementById("quiz-container").classList.remove("nascondi");
        document.getElementById("titolo-lezione-corrente").innerText = "Ripasso Domande Sbagliate";

        mostraDomanda();
    }

    function mostraDomanda() {
        document.getElementById("btn-prossima").classList.add("nascondi");
        let d = domandeAttive[indiceDomanda];
        
        document.getElementById("progresso").innerText = `Domanda ${indiceDomanda + 1} di ${domandeAttive.length}`;
        document.getElementById("domanda-testo").innerText = d.testo;

        let opzioniDiv = document.getElementById("opzioni-container");
        opzioniDiv.innerHTML = "";

        d.opzioni.forEach((opzione, index) => {
            let btnOp = document.createElement("button");
            btnOp.className = "btn-risposta";
            btnOp.innerText = opzione;
            btnOp.onclick = () => controllaRisposta(index, d.corretta, btnOp);
            opzioniDiv.appendChild(btnOp);
        });
    }

    function controllaRisposta(scelta, corretta, btnSelezionato) {
        let tuttiBottoni = document.querySelectorAll(".btn-risposta");
        tuttiBottoni.forEach(b => b.disabled = true);

        if (scelta === corretta) {
            btnSelezionato.classList.add("corretta");
            punteggio++;
        } else {
            btnSelezionato.classList.add("errata");
            tuttiBottoni[corretta].classList.add("corretta");
            
            // Aggiungi alla lista errori se non è già presente
            let domandaCorrente = domandeAttive[indiceDomanda];
            if (!domandeSbagliateGlobali.includes(domandaCorrente)) {
                domandeSbagliateGlobali.push(domandaCorrente);
            }
        }

        document.getElementById("btn-prossima").classList.remove("nascondi");
    }

    function prossimaDomanda() {
        indiceDomanda++;

            mostraDomanda();
        } else {
            mostraRisultati();
        }
    }

    function mostraRisultati() {
        document.getElementById("quiz-container").classList.add("nascondi");
        document.getElementById("risultati-container").classList.remove("nascondi");

        let percentuale = Math.round((punteggio / domandeAttive.length) * 100);
        document.getElementById("testo-punteggio").innerText = `Punteggio: ${punteggio} su ${domandeAttive.length}`;
        document.getElementById("testo-percentuale").innerText = `Percentuale di risposte esatte: ${percentuale}%`;
    }

    function tornaAlMenu() {
        document.getElementById("quiz-container").classList.add("nascondi");
        document.getElementById("risultati-container").classList.add("nascondi");
        document.getElementById("menu-container").classList.remove("nascondi");
        inizializzaMenu();
    }

    window.onload = inizializzaMenu;
</script>

</body>
</html>
